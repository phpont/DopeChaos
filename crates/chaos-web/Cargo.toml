[package]
name = "chaos-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
chaos-core = { path = "../chaos-core" }
leptos = { version = "=0.8.22", features = ["csr"] }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"

[dependencies.web-sys]
version = "=0.3.106"
features = [
    "DomRect",
    "DomRectReadOnly",
    "Event",
    "EventTarget",
    "Element",
    "HtmlCanvasElement",
    "ResizeObserver",
    "Window",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
]